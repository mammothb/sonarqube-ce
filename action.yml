name: 'SonarQube CE Scan'
description: >
  SonarQube Community Edition scan with Docker. No external server required.

branding:
  icon: 'target'
  color: 'blue'
inputs:
  sonar-project-name:
    description: 'SonarQube project name (also used as project key)'
    required: false
    default: ${{ github.event.repository.name }}
  sonar-source-path:
    description: 'Source path from git root'
    required: false
    default: '.'
  sonar-server-image:
    description: 'SonarQube Community Edition Docker image'
    required: false
    default: 'sonarqube:25.5.0.107428-community'
  sonar-scanner-image:
    description: 'Sonar Scanner CLI Docker image'
    required: false
    default: 'sonarsource/sonar-scanner-cli:11.3'
  scan-mode:
    description: >
      Scan mode: 'cli' runs the scanner in this step (default); 'none' skips
      the scan so you can run an external scanner (e.g. SonarScanner for .NET)
      in a later step.

    required: false
    default: 'cli'
  sonar-options:
    description: >
      Extra Sonar Scanner options (e.g. -Dsonar.rust.clippy.reportPaths=...)

    required: false
  pre-scan-script:
    description: >
      Path to script or inline script run before scan. Use for installing toolchains (e.g. rustup, clippy) or generating external analyzer reports.

    required: false
  github-token:
    description: 'GitHub token for PR comments. Defaults to GITHUB_TOKEN env var.'
    required: false
    default: ''
  generate-pr-comment:
    description: 'Post analysis summary as PR comment'
    required: false
    default: 'false'
  new-code-n-days:
    description: 'Days for new-code period'
    required: false
    default: '30d'
  reports-scopes:
    description: 'Report scopes: ["overall","new"], ["new"], or []'
    required: false
    default: '[]'
  reports-retention-days:
    description: 'Artifact retention in days'
    required: false
    default: '7'
outputs:
  sonar-host-url:
    description: 'Host-reachable SonarQube URL for external scanners (e.g. http://localhost:9234)'
  sonar-project-key:
    description: 'SonarQube project key (sanitized from sonar-project-name)'
  sonar-token:
    description: 'Generated user token (valid only for the ephemeral server)'
  overall-reports-artifact-id:
    description: 'Overall reports artifact ID'
  new-reports-artifact-id:
    description: 'New-code reports artifact ID'
  analysis-summary:
    description: 'Analysis summary markdown'
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
