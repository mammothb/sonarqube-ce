name: Update Major Version
run-name: Move ${{ github.event.inputs.major_version }} to ${{ github.event.inputs.target }}
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7 — inputs required for tag management, not a build
    inputs:
      target:
        description: The tag or reference to use (e.g. v1.3.0)
        required: true
      major_version:
        type: choice
        description: The major version to update
        options:
          - v1
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # zizmor: ignore[artipacked] — no artifacts uploaded, creds needed for git push
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag new target
        env:
          MAJOR_VERSION: ${{ github.event.inputs.major_version }}
          TARGET: ${{ github.event.inputs.target }}
        run: git tag -f "$MAJOR_VERSION" "$TARGET"
      - name: Push new tag
        env:
          MAJOR_VERSION: ${{ github.event.inputs.major_version }}
        run: git push origin "$MAJOR_VERSION" --force
