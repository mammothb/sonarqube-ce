name: Continuous Integration
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup - Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        id: npm-ci
        run: npm ci
      - name: Lint & Format
        id: biome-ci
        run: npx @biomejs/biome ci .
      - name: Test
        id: npm-test
        run: npm test
  test-action:
    name: E2E — SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - name: Run Action
        id: test-action
        uses: ./
        with:
          reports-scopes: '["overall","new"]'
          reports-retention-days: '1'
      - name: Verify outputs
        run: |
          echo "### Results" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Summary: ${{ steps.test-action.outputs.analysis-summary != '' }}"
          echo "- Overall artifact: ${{ steps.test-action.outputs.overall-reports-artifact-id != '' }}"
          echo "- New artifact: ${{ steps.test-action.outputs.new-reports-artifact-id != '' }}"
